[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-screening"
version = "0.1.0"
description = "Read-only resume screening for BOSS recruiting console. No messaging, no paid actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
collector = ["httpx>=0.27"]

[project.scripts]
bosscreen = "bosscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
